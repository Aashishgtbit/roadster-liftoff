<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roadster Liftoff</title>
<meta name="description" content="Unofficial fan app for the Oct 15, 2026 Tesla Roadster unveiling: two physics-simulated 3D stunts and a drivable game with live synthesised sound.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
<div class="app" id="app">
<header class="bar">
  <div class="brand"><b>Roadster <em>Liftoff</em></b><span class="label">Fan-made · not affiliated with Tesla</span></div>
  <nav class="stunts" role="tablist" aria-label="Choose a stunt">
  <button class="tab" title="Roll over five cars" type="button" role="tab" data-stunt="jump" aria-selected="true">Lineup jump</button>
  <button class="tab" title="Your turn: bust, fly, race the clock" type="button" role="tab" data-stunt="drive" aria-selected="false">Drive it</button>
  <button class="tab" title="Up the wall, x-axis flip, drive away" type="button" role="tab" data-stunt="ramp" aria-selected="false">Ramp hang</button>
  </nav>
  <div class="bar-actions">
    <a class="btn icon ghost" href="about.html" title="The unveiling, the trims, the timeline and how this page works"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg><span>The story</span></a>
    <button class="btn icon" id="soundBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zM16.5 8.5a5 5 0 0 1 0 7"/></svg><span>Sound: off</span></button>
    <button class="btn icon" id="fsBtn" type="button" aria-pressed="false" title="Full screen (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Full screen</span></button>
  </div>
</header>
<main class="stage" id="stage">
  <button class="btn icon fs-float" id="fsFloat" type="button" title="Exit full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Exit full screen</span></button>
  <div class="game" id="gameUI" hidden>
    <div class="g-panel">
      <div class="g-speedo" id="gameSpeedo"></div>
      <div class="g-fuel" id="gameFuel"></div>
    </div>
    <aside class="g-score" aria-live="polite">
      <span class="label">Score</span>
      <b class="g-score-value" id="gameScore">0</b>
      <ol class="g-feed" id="gameFeed"></ol>
      <div class="g-stats" id="gameStats"></div>
    </aside>
    <div class="g-toast" id="gameToast"></div>
    <div class="g-help" id="gameHelp"><p class="g-tip" id="gameTip"></p></div>
    <div class="g-touch" id="gameTouch" aria-hidden="true"></div>
    <div class="g-over" id="gameOver" hidden>
      <div class="g-card" role="dialog" aria-labelledby="goTitle">
        <button class="g-close" id="goClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <span class="label" id="goTitle">Finish</span>
        <p class="g-big"><b id="goScore">0</b> points</p>
        <p class="g-new" id="goNew" hidden>New best!</p>
        <div class="g-tiles" id="goStats"></div>
        <p class="g-note" id="goNote" hidden></p>
        <p class="g-row"><span>Your best <b id="goBest">—</b></span></p>
        <div class="g-btns"><button class="btn primary" id="againBtn" type="button">Try again</button><button class="btn" id="newCourseBtn" type="button">New course</button></div>
      </div>
    </div>
  </div>
  <canvas id="scene" tabindex="0" aria-label="3D animation: a white roadster fires cold-gas thrusters, rolls upside down over a row of parked cars, a Semi and a Cybertruck at night, and lands." role="img"></canvas>
  <div class="stage-msg" id="stageMsg">Building the 3D scene…</div>
  <div class="hud" id="hud" aria-hidden="true">
    <span class="hud-phase" id="hudPhase">Roll</span>
    <div class="hud-gauges">
      <div class="hud-speed" id="hudSpeed"></div>
      <div class="hud-attitude" id="hudAttitude"></div>
      <div class="hud-height" id="hudHeight"></div>
      <div class="hud-nozzles" id="hudNozzles"></div>
      <div class="hud-suction" id="hudSuction"></div>
    </div>
  </div>
  <div class="stage-ctl">
    <button class="btn icon" id="wingBtn" type="button" aria-pressed="true" title="Cycle the wing: Road, High-Downforce, Low-Drag"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h18M6 8l-1 6M18 8l1 6M9 14h6"/></svg><span>Wing: High-Downforce</span></button>
    <button class="btn icon" id="camBtn" type="button" title="Drag to orbit the car"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg><span>Free look</span></button>
    <button class="btn icon primary" id="playBtn" type="button" title="Take the controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10h4M8 8v4M15 9.5h.01M18 11.5h.01M7 5h10a5 5 0 0 1 5 5v2a5 5 0 0 1-9 3h-2a5 5 0 0 1-9-3v-2a5 5 0 0 1 5-5z"/></svg><span>Play it</span></button>
    <button class="btn icon" id="pauseBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><span>Pause</span></button>
    <button class="btn icon" id="replayBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg><span>Replay</span></button>
  </div>
  <div class="stage-note" id="stageNote">Fan model from Tesla's photos · simulated physics and sound, not footage</div>
</main>
</div>
<script>
  // if the 3D modules never arrive, say so instead of leaving a blank stage
  setTimeout(() => { if (!window.__sceneReady) { const m = document.getElementById("stageMsg"); if (m) m.textContent = "The 3D scene could not load. It needs WebGL and a network connection."; } }, 15000);
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
